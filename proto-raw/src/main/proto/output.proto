// Une monture (résumé d'enclos). Génération + généalogie NON présents ici
// (détail au clic) — aucun champ ne vaut la génération.
message hlo {
  bool feai = 1;            // ? (jamais observé true)
  optional string feaj = 2; // nom (confirmé)
  repeated hhb feal = 3;    // ?
  int32 feam = 4;           // id d'apparence/robe (96 amande, 97 ivoire, 101 doré+pourpre)
  int32 fean = 5;           // niveau (confirmé)
  int32 feao = 6;           // xp (confirmé)
  hlm feap = 7;             // couleurs de la monture (cf. hlm), varie par robe
  hlk feaq = 8;             // ?
  repeated kiv fear = 9;    // effets (confirmé)
  int32 feas = 10;          // sérénité, signée (confirmé). Présente même si stérile,
                            // mais l'UI l'affiche « indisponible » dans ce cas.
  bool feat = 11;           // stérile (true=stérile). Confirmé (n=1, à reconfirmer)
  bool feau = 12;           // sexe mâle (true=mâle, absent=femelle). Confirmé (n=1)
  repeated hll feav = 13;   // jauges monture amour/maturité/endurance (confirmé)
  // Couleurs de la monture (2 slots feac/fead, feae inutilisé). Varie par robe :
  // amande {107,102} ; ivoire {121,118} ; doré+pourpre {97,90}.
  message hlm {
    int32 feac = 1;
    int32 fead = 2;
    int32 feae = 3;
  }
  enum hlk {
    HLK_DYKR = 0;
    HLK_DYKS = 1;
    HLK_DYKT = 2;
    HLK_DYKU = 3;
    HLK_DYKV = 4;
  }
  message hll {
    int32 fdzx = 1;
    hhd fdzy = 2;
  }
}

