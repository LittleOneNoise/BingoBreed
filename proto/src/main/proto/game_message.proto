syntax = "proto3";

import "google/protobuf/any.proto";

package proto;

option java_package = "com.chatofus.proto.game_message";
option java_outer_classname = "GameMessageProto";
option java_multiple_files = true;

// guc
message GameMessage {
  oneof content {
    Request request = 3;
    Response response = 1;
    Event event = 2;
  }
}

// gud
message Request {
  int32 uid = 1;
  .google.protobuf.Any content = 2;
}

// gug
message Response {
  bool ezrb = 1;
  int32 uid = 2;
  int32 ezrd = 3;
  .google.protobuf.Any content = 4;
  gue ezrf = 5;
  enum gue {
    GUE_DTTU = 0;
    GUE_DTTV = 1;
    GUE_DTTW = 2;
  }
}




// guh
message Event {
  .google.protobuf.Any content = 1;
}

